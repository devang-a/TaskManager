[package]
name = "nitc-hq-backend"
version = "1.0.0"
edition = "2021"

[dependencies]
chrono = "0.4"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
