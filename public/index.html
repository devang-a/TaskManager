<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1430">
  <meta name="description" content="A calm, local-first workspace for your NITC coursework and tasks.">
  <title>NITC HQ Tasks</title>
  <link rel="icon" type="image/svg+xml" href="/nitc-hq-logo.svg">
  <link rel="help" href="/agent-guide.html" title="AI agent and workflow instructions">
  <meta name="ai-instructions" content="Read /agent-guide.html before creating, editing, or completing tasks.">
  <link rel="stylesheet" href="/styles.css">
  <script>try{var t=localStorage.getItem('nitc-theme')||'night-reef';var m={white:'night-reef',system:'night-reef',light:'night-reef',editorial:'night-reef',dark:'midnight'};document.documentElement.dataset.theme=m[t]||t;}catch(e){document.documentElement.dataset.theme='night-reef';}</script>
</head>
<body>
  <video id="theme-bg" class="theme-bg" src="/themes/night-reef.mp4" poster="/themes/night-reef.jpg" autoplay loop muted playsinline preload="auto" disablepictureinpicture disableremoteplayback aria-hidden="true"></video>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#todo" aria-label="NITC HQ Tasks home">
        <img class="brand-mark" src="/nitc-hq-logo.svg" alt="" width="28" height="28">
        <strong>NITC HQ</strong>
      </a>

      <nav class="main-nav" aria-label="Views">
        <button class="nav-item active" data-view="todo"><span>To do</span><span id="todo-count" class="nav-count">—</span></button>
        <button class="nav-item" data-view="done"><span>Done</span></button>
        <button class="nav-item" data-view="all"><span>All</span></button>
        <button class="nav-item" data-view="calendar"><span>Calendar</span></button>
        <button class="nav-item" data-view="study"><span>Study</span><span id="study-nav-badge" class="nav-count study-live-badge" hidden></span></button>
      </nav>

      <div class="top-actions">
        <button type="button" class="icon-button theme-cycle-button" id="theme-cycle" aria-label="Next theme" title="Cycle theme">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
        <div class="theme-wrapper">
          <button class="icon-button theme-button" id="theme-button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose theme" title="Choose theme">☾</button>
          <div class="theme-menu" id="theme-menu" role="menu" aria-label="Themes" hidden></div>
        </div>
        <button class="button button-primary add-button" id="new-task"><span class="plus" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>New</button>
      </div>
    </header>

    <main class="main-area">
      <section class="content" aria-labelledby="page-title">
        <div class="toolbar">
          <div class="toolbar-title">
            <h1 id="page-title">To do</h1>
            <span class="count-chip" id="list-count">0</span>
            <span class="inline-stats" aria-label="Task overview"><span id="open-metric">—</span> open · <span id="due-metric">—</span> due today · <span id="done-metric">—</span> done</span>
          </div>
          <div class="list-actions">
            <label class="search-box"><span class="search-icon" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><input id="search" type="search" placeholder="Search" aria-label="Search tasks"></label>
            <label class="filter-select-label"><span class="sr-only">Filter tasks by course</span><select id="course-filter" aria-label="Filter tasks by course"><option value="">All courses</option></select></label>
          </div>
        </div>

        <section class="task-section" aria-label="Tasks">
          <div id="task-list" class="task-list" aria-live="polite"></div>
          <div id="calendar-view" class="calendar-view" hidden></div>
        </section>

        <footer class="page-footer">
          <a href="/agent-guide.html">AI agent guide</a>
        </footer>
      </section>
    </main>
  </div>

  <dialog id="task-dialog" class="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form" method="dialog">
      <div class="dialog-top"><div><p class="eyebrow">TASK DETAILS</p><h2 id="dialog-title">New task</h2></div><button type="button" class="icon-button close-dialog" aria-label="Close dialog">×</button></div>
      <input type="hidden" name="id">
      <label class="field-label" for="task-title">Task name</label><input class="text-input" id="task-title" name="title" required maxlength="180" placeholder="What needs doing?">
      <div class="field-row"><div><label class="field-label" for="task-type">Type</label><select class="text-input" id="task-type" name="type"><option>Coursework</option><option>Miscellaneous</option></select></div><div id="course-field"><label class="field-label" for="task-course">Course</label><select class="text-input" id="task-course" name="course"></select></div></div>
      <div class="field-row"><div><label class="field-label" for="task-due">Due date <span class="optional">optional</span></label><input class="text-input" id="task-due" name="dueDate" type="date"></div><div><label class="field-label" for="task-priority">Priority <span class="optional">1–10</span></label><select class="text-input" id="task-priority" name="priority"></select></div></div>
      <label class="field-label" for="task-notes">Notes <span class="optional">optional</span></label><textarea class="text-input notes-input" id="task-notes" name="notes" rows="3" placeholder="Add useful context"></textarea>
      <div class="form-error" id="form-error" role="alert" hidden></div>
      <div class="dialog-actions"><button type="button" class="button button-quiet close-dialog">Cancel</button><button type="submit" class="button button-primary" id="save-task">Save task</button></div>
    </form>
  </dialog>

  <section id="study-stage" class="study-stage" aria-label="Study timer" hidden>
    <div class="study-corner-top">
      <button type="button" class="study-ghost-btn" id="study-exit" aria-label="Back to workspace">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span>Tasks</span>
      </button>
      <div class="study-corner-right">
        <button type="button" class="study-ghost-btn" id="study-theme-cycle" aria-label="Cycle theme" title="Cycle theme (T)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          <span id="study-theme-label">Night Reef</span>
        </button>
        <button type="button" class="study-ghost-btn" id="study-graph-toggle" aria-expanded="false" aria-controls="study-graph-panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 3 6-7 3 2"/><path d="M3 20h18"/></svg>
          <span>Progress</span>
        </button>
      </div>
    </div>

    <div class="study-center">
      <div class="study-status-row">
        <span class="study-pulse" id="study-pulse" aria-hidden="true"></span>
        <span id="study-day-label" aria-label="Current time"></span>
      </div>
      <div class="study-clock" id="study-clock" role="timer" aria-live="off">00:00:00</div>
      <div class="study-controls">
        <button type="button" class="study-primary-btn" id="study-toggle">
          <span class="study-toggle-icon" id="study-toggle-icon" aria-hidden="true"></span>
          <span id="study-toggle-label">Start studying</span>
        </button>
        <button type="button" class="study-secondary-btn study-finish-icon" id="study-finish" aria-label="Done for today" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </div>
      <p class="study-whisper" id="study-whisper" hidden></p>
    </div>

    <div id="study-graph-panel" class="study-graph-panel" role="region" aria-label="Study hours progress" hidden>
      <div class="study-graph-card">
        <div class="study-graph-head">
          <div>
            <h2>Study hours</h2>
            <p id="study-graph-subtitle">Daily momentum across your study days</p>
          </div>
          <div class="study-graph-actions">
            <div class="study-range-tabs" role="tablist" aria-label="Time range">
              <button type="button" role="tab" aria-selected="false" data-study-range="7">7D</button>
              <button type="button" role="tab" aria-selected="true" data-study-range="14">14D</button>
              <button type="button" role="tab" aria-selected="false" data-study-range="30">30D</button>
            </div>
            <button type="button" class="icon-button" id="study-graph-close" aria-label="Close progress graph">×</button>
          </div>
        </div>

        <div class="study-stats-grid">
          <div class="study-stat"><small>Today</small><strong id="stat-study-today">0m</strong></div>
          <div class="study-stat"><small>Last 7 days</small><strong id="stat-study-week">0h</strong></div>
          <div class="study-stat"><small>Daily avg</small><strong id="stat-study-avg">0m</strong></div>
          <div class="study-stat"><small>Streak</small><strong id="stat-study-streak">0 days</strong></div>
        </div>

        <div class="study-chart-wrap">
          <div id="study-chart-tooltip" class="study-chart-tooltip" hidden></div>
          <div id="study-chart" class="study-chart" aria-label="Daily study hours line graph"></div>
        </div>

        <div class="study-graph-foot" id="study-graph-foot">Start a session to light up today’s point.</div>
      </div>
    </div>

    <aside id="music-dock" class="music-dock" aria-label="Apple Music controls" hidden>
      <div id="music-queue-panel" class="music-queue-panel" hidden>
        <div class="music-queue-head">
          <div class="music-queue-title-group">
            <strong id="music-playlist-name">Current playlist</strong>
            <span id="music-playlist-meta"></span>
          </div>
          <label class="music-vol-wrap" aria-label="Apple Music volume">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            <input id="music-volume" type="range" min="0" max="100" value="80" aria-label="Volume">
          </label>
        </div>
        <div id="music-queue-list" class="music-queue-list" role="list"></div>
      </div>

      <div id="music-idle-bar" class="music-idle-bar">
        <span class="music-idle-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span>Apple Music</span>
        </span>
        <button type="button" class="music-open-btn" id="music-open">Open</button>
      </div>

      <div id="music-player-bar" class="music-player-bar" hidden>
        <div class="music-main-row">
          <button type="button" class="music-btn music-star-btn" id="music-fav" aria-label="Favorite track" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.82 5.71 6.3.92-4.56 4.44 1.08 6.28L12 17.18l-5.64 2.97 1.08-6.28-4.56-4.44 6.3-.92L12 2.8z"/></svg>
          </button>
          <div class="music-art-wrap">
            <img id="music-art" class="music-art" alt="" hidden>
            <span id="music-art-fallback" class="music-art-fallback" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </span>
          </div>
          <div class="music-info">
            <div id="music-title" class="music-title">Not playing</div>
            <div id="music-artist" class="music-artist">Apple Music</div>
          </div>
          <span class="music-divider" aria-hidden="true"></span>
          <div class="music-actions">
            <button type="button" class="music-btn music-btn-sub" id="music-shuffle" aria-label="Toggle shuffle" aria-pressed="false">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.8c1.3 0 2.5-.6 3.3-1.7l5.8-8.6c.7-1.1 2-1.7 3.3-1.7H21"/><path d="m17.5 2.5 3.5 3.5-3.5 3.5"/><path d="M2 6h2.2c1.4 0 2.7.8 3.4 2"/><path d="M21 18h-4.8c-1.3 0-2.6-.7-3.3-1.8l-.6-.9"/><path d="m17.5 14.5 3.5 3.5-3.5 3.5"/></svg>
            </button>
            <button type="button" class="music-btn music-btn-transport" id="music-prev" aria-label="Previous track">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.6 7.4c.5-.3 1.1.06 1.1.64v7.92c0 .58-.6.94-1.1.64l-6.4-3.96a.75.75 0 0 1 0-1.28l6.4-3.96zm9 0c.5-.3 1.1.06 1.1.64v7.92c0 .58-.6.94-1.1.64l-6.4-3.96a.75.75 0 0 1 0-1.28l6.4-3.96z"/></svg>
            </button>
            <button type="button" class="music-btn music-btn-play" id="music-play" aria-label="Play or pause"></button>
            <button type="button" class="music-btn music-btn-transport" id="music-next" aria-label="Next track">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.4 7.4c-.5-.3-1.1.06-1.1.64v7.92c0 .58.6.94 1.1.64l6.4-3.96a.75.75 0 0 0 0-1.28l-6.4-3.96zm-9 0c-.5-.3-1.1.06-1.1.64v7.92c0 .58.6.94 1.1.64l6.4-3.96a.75.75 0 0 0 0-1.28L3.4 7.4z"/></svg>
            </button>
            <button type="button" class="music-btn music-btn-sub" id="music-repeat" aria-label="Cycle repeat" aria-pressed="false">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2.5 3.5 3.5L17 9.5"/><path d="M3.5 11v-1a4 4 0 0 1 4-4h13"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M20.5 13v1a4 4 0 0 1-4 4h-13"/></svg>
              <span class="music-repeat-one" id="music-repeat-one" hidden>1</span>
            </button>
            <button type="button" class="music-btn music-btn-sub" id="music-queue-btn" aria-label="Show playlist queue" aria-expanded="false" aria-controls="music-queue-panel">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="4.5" cy="7" r="1" fill="currentColor" stroke="none"/><path d="M9 7h11"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M9 12h11"/><circle cx="4.5" cy="17" r="1" fill="currentColor" stroke="none"/><path d="M9 17h11"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
